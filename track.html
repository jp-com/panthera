<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>PANTHERA | Your order</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2eee6;color:#201d1b;font:15px/1.6 Arial,sans-serif}header{padding:24px;border-bottom:1px solid #c9c3b9;text-align:center}header a{font:25px Georgia,serif;letter-spacing:3px;text-decoration:none}main{max-width:660px;margin:auto;padding:60px 24px}h1,h2{font:normal 36px Georgia,serif;margin:0 0 18px}h2{font-size:24px;margin:28px 0 12px}a{color:inherit}button{font:inherit;background:#201d1b;color:#fff;border:1px solid #201d1b;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5}small{color:#625e59}label{display:block}input{display:block;width:100%;font:inherit;background:transparent;border:1px solid #c9c3b9;padding:12px;margin:8px 0 16px}dl{margin:0}dt{color:#625e59}dd{margin:0 0 15px;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #c9c3b9;margin:24px 0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}.step{padding:10px 0;border-top:2px solid #c9c3b9;font-size:12px}.step.done{border-color:#201d1b;font-weight:bold} [hidden]{display:none!important}
</style></head><body><header><a href="/">PANTHERA</a></header><main><h1>Your order</h1><p id="status" role="status" aria-live="polite">Enter your private order access code to view its status.</p><form id="access"><label for="code">Order access code</label><input id="code" type="password" autocomplete="off" spellcheck="false" required maxlength="110"><button>View order</button></form><section id="details" hidden><div id="steps" class="steps"></div><dl id="info"></dl><h2>Items</h2><div id="items"></div><section id="shipping" hidden><h2>Delivery tracking</h2><dl id="shipments"></dl></section><hr><button id="refresh" type="button">Refresh status</button> <button id="clear" type="button">Close order</button></section><p><small>Your private access code is not your order reference. Keep it confidential. If you no longer have the code, contact the store using your order confirmation.</small></p><p><a href="/">Return to PANTHERA</a></p></main><script>
const $=id=>document.getElementById(id);let token='',generation=0;
const statusNames={pending:'Payment pending verification',paid:'Payment confirmed',failed:'Payment failed',expired:'Checkout expired',partially_refunded:'Partially refunded',refunded:'Refunded'};
const fulfillmentNames={unfulfilled:'Awaiting processing',processing:'Preparing for dispatch',shipped:'Dispatched',delivered:'Delivered',cancelled:'Cancelled'};
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)/100);
function pair(parent,label,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=String(value??'');parent.append(dt,dd)}
function render(d){const o=d.order;for(const id of ['steps','info','items','shipments'])$(id).replaceChildren();const stages=['Confirmed','Processing','Dispatched','Delivered'];const position=({unfulfilled:0,processing:1,shipped:2,delivered:3})[o.fulfillment_status]??-1;stages.forEach((stage,i)=>{const el=document.createElement('div');el.className='step'+(['paid','partially_refunded'].includes(o.payment_status)&&i<=position?' done':'');el.textContent=stage;$('steps').append(el)});pair($('info'),'Order reference',o.reference);pair($('info'),'Payment',statusNames[o.payment_status]||'Unknown');pair($('info'),'Fulfilment',fulfillmentNames[o.fulfillment_status]||'Unknown');pair($('info'),'Order total',usd(o.total_cents));if(Number(o.refunded_cents)>0)pair($('info'),'Refunded',usd(o.refunded_cents));pair($('info'),'Delivery method',o.shipping_method==='air'?'Priority air':'Standard sea');for(const i of d.items){const p=document.createElement('p');p.textContent=i.quantity+' × '+i.name_snapshot;$('items').append(p)}for(const s of d.shipments){pair($('shipments'),'Carrier',s.carrier);pair($('shipments'),'Tracking reference',s.tracking_number);if(s.delivered_at)pair($('shipments'),'Delivered',new Date(s.delivered_at).toLocaleDateString())}$('shipping').hidden=!d.shipments.length;$('details').hidden=false;$('access').hidden=true;$('status').textContent=statusNames[o.payment_status]||'Order found'}
async function load(){const g=++generation;$('status').textContent='Checking your order…';try{const r=await fetch('/api/order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',referrerPolicy:'no-referrer'});if(g!==generation)return;if(!r.ok)throw Error();const d=await r.json();if(g!==generation)return;render(d)}catch{if(g===generation){$('details').hidden=true;$('access').hidden=false;for(const id of ['steps','info','items','shipments'])$(id).replaceChildren();$('status').textContent='Order unavailable. Check your private access code or try again later.'}}}
function closeOrder(){generation++;token='';try{sessionStorage.removeItem('panthera-order-access')}catch{}$('code').value='';$('details').hidden=true;$('access').hidden=false;for(const id of ['steps','info','items','shipments'])$(id).replaceChildren();$('status').textContent='Enter your private order access code to view its status.'}
$('access').onsubmit=e=>{e.preventDefault();token=$('code').value.trim();$('code').value='';load()};$('refresh').onclick=load;$('clear').onclick=closeOrder;
try{const fragment=new URLSearchParams(location.hash.slice(1)).get('access');if(location.hash)history.replaceState(null,'',location.pathname);if(fragment){token=fragment}else token=sessionStorage.getItem('panthera-order-access')||''}catch{}
if(token)load();
</script></body></html>
